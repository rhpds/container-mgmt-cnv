# Publishing House — Project Spec
# Lifecycle: intake → content_review → infra_review → jira_sync → development → ready → published
# No secrets in this file. Tokens live in ~/.config/publishing-house/auth.json
# Stage is managed by SonataFlow and cached in .ph-state — do not edit stage.current manually.
# NOTE: This file is also in the template repo. The Scaffolder overlays project.* values.
# TODO: Eliminate this copy — Scaffolder should pull from template repo directly.

project:
  slug: "container-mgmt-cnv"
  owner_email: "jboeselm@redhat.com"
  content_type: "demo"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "A hands-on OpenShift demo showcasing core container management capabilities — deploying third-party and existing applications, secure-by-default policies, day-2 cluster operations, observability, and multi-cluster management with Red Hat Advanced Cluster Management and Advanced Cluster Security"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-973"
  workflow_id: "19b2a802-833c-4330-ab6c-c0c20bea817b"

spec:
  title: "Container Management Standard Demo"
  learning_objectives:
  - "Deploy third-party and existing applications on OpenShift without relying on application-platform-specific features"
  - "Demonstrate OpenShift's secure-by-default posture using Security Context Constraints, RBAC, and NetworkPolicies"
  - "Implement day-2 cluster operations, including an over-the-air upgrade, and observe self-healing/reconciliation behavior"
  - "Monitor cluster health and application performance using built-in observability tooling"
  - "Manage multiple clusters, including a non-OpenShift cluster, from a single hub using Red Hat Advanced Cluster Management"
  - "Secure the cluster and its workloads using Red Hat Advanced Cluster Security"
  modules:                 # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
  - id: module-01
    title: "Console Overview"
    duration_min: 10
    status: not_started
  - id: module-02
    title: "Deploying COTS and existing applications"
    duration_min: 12
    status: not_started
  - id: module-03
    title: "Secure by default"
    duration_min: 10
    status: not_started
  - id: module-04
    title: "Cluster Operations"
    duration_min: 10
    status: not_started
  - id: module-05
    title: "Observability - Logging and Monitoring"
    duration_min: 10
    status: not_started
  - id: module-06
    title: "Multi-Cluster Management with ACM"
    duration_min: 12
    status: not_started
  - id: module-07
    title: "Securing the Cluster with ACS"
    duration_min: 10
    status: not_started
  environment:
    platform: "ocp"            # ocp | rhel-vms — determines which sizing fields apply
    topology: "cnv-pool"       # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: "4.22"                 # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: "multinode"          # sno | multinode — only for platform = ocp
    control_plane_instance_count: 1    # 1 if sno, 3 if multinode — inherited as-is from security-roadshow-cnv (SNO-sized control plane + separate workers)
    control_plane_cpu: 32              # 32 if sno, 16 if multinode
    control_plane_ram_gb: 128          # 128 if sno, 64 if multinode
    worker_count: 3                    # number of OCP worker nodes
    worker_cpu: 16                     # vCPU per worker
    worker_ram_gb: 32                  # RAM per worker in GB
    worker_disk_gb: 100                # disk per worker in GB — ESTIMATE, not confirmed from base CI research; pending confirmation from infra reviewer against actual security-roadshow-cnv values. Additional headroom needed for Crunchy Postgres demo (Module 2, >=10-15GiB) and MinIO/LokiStack (Module 5, needs default StorageClass)

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products — N/A, AAP not in products
    ai_requirement: "maas"              # maas | gpu | none
    ai_model_tier: "frontier"           # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: "Azure AI (OpenShift Lightspeed backend)" # specific model e.g. granite-3.1-8b
    ai_justification: "OpenShift Lightspeed only supports a small set of proprietary LLM providers (OpenAI, Azure OpenAI, IBM watsonx) — no open-source option available. Reuses the security-roadshow-cnv base CI's proven Azure AI-backed pattern with automatic token provisioning/rotation." # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products:
    - "Cluster Observability Operator — Troubleshooting Panel UI plugins (some capabilities are Technology Preview)"
    non_ga_access_plan: "None required — enabled via standard OperatorHub install on OCP 4.22, same as any other operator"
    external_services:
    - "github.com"          # Showroom content repo, RHACS demo VM init script (rhpds/rhacs-demo), ralvares/openshift-security-framework attribution
    - "mpbravo.github.io"   # SQL Server + Online Boutique Helm chart repos — interim, pending dedicated automation repo
    - "Azure AI endpoint"   # OpenShift Lightspeed backend
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 1.4
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: "Trust-based — this is a presenter-led demo with no automated learner validation."
    catalog_gap: "Existing catalog items (OPP Hands-on Lab, ACM Demo, Sovereign Cloud Lab) cover the same ACM/ACS/GitOps/virtualization product set, but only as multi-hour (150-300 min) hands-on labs aimed at deep technical practice. None package this scope as a short, presenter-led demo aimed at customers/prospects evaluating OpenShift specifically for container management, or pair it with deploying third-party/existing software as the opening use case."
    design_overview: "This demo addresses a gap in how OpenShift is positioned to customers and prospects evaluating container-management platforms specifically, not just application platforms. Aimed at platform engineers, infrastructure architects, and IT decision-makers at an intermediate level, it walks through deploying third-party and existing software, OpenShift's secure-by-default posture, day-2 cluster operations, observability, and multi-cluster management with ACM (including a non-OpenShift spoke) and ACS — all in a single ~84-minute presenter-led session."
    module_summaries:
    - title: "Console Overview"
      overview: "Orients the audience to the OpenShift web console as a shared baseline before the container-management-specific modules that follow."
    - title: "Deploying COTS and existing applications"
      overview: "Presenter deploys Crunchy PostgreSQL via Operator, Microsoft SQL Server via Helm, and the existing Online Boutique application on OpenShift, showing each runs without application-platform-specific features."
    - title: "Secure by default"
      overview: "Presenter walks through Security Context Constraints, RBAC, and NetworkPolicies to show OpenShift's built-in security posture."
    - title: "Cluster Operations"
      overview: "Presenter performs a live over-the-air cluster upgrade, demonstrates self-healing/reconciliation, and shows OpenShift Lightspeed troubleshooting scenarios."
    - title: "Observability - Logging and Monitoring"
      overview: "Presenter reviews built-in metrics, LokiStack logging, and the troubleshooting panel for monitoring cluster and application health."
    - title: "Multi-Cluster Management with ACM"
      overview: "Presenter shows Red Hat Advanced Cluster Management managing both an OpenShift cluster and a non-OpenShift cluster from a single hub."
    - title: "Securing the Cluster with ACS"
      overview: "Presenter uses a pre-staged vulnerable demo VM to show Red Hat Advanced Cluster Security's vulnerability scanning, compliance, and risk profiling."
    rcars_overlap_pct: 100
    rcars_top_matches:
    - title: "Hands-on lab with Red Hat OpenShift Platform Plus (2025)"
      ci_name: "sandboxes-gpte.opp-hol.prod"
      url: "https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.opp-hol.prod"
      relevance_score: 100
      why_it_fits: "This lab directly covers every major product and topic in the request — OpenShift, OpenShift Virtualization, ACM, ACS, GitOps/ArgoCD, Pipelines-adjacent CI/CD security, and Quay — with hands-on exercises spanning multi-cluster management, secure-by-default policy enforcement, day-2 operations, and observability at an intermediate level."
    - title: "Advanced Cluster Management for Kubernetes Demo"
      ci_name: "published.ocp4-acm-demo.prod"
      url: "https://catalog.demo.redhat.com/catalog?item=published.ocp4-acm-demo.prod"
      relevance_score: 95
      why_it_fits: "This lab directly covers ACM multi-cluster management across OpenShift clusters, governance/policy enforcement (secure-by-default), multicluster observability, OpenShift Virtualization fleet management, and GitOps with ArgoCD — all core topics in the request."
    - title: "Sovereign Cloud Architecture with OpenShift: Multi-Cluster Data Residency and Compliance Management"
      ci_name: "published.sovereign-cloud-lab.prod"
      url: "https://catalog.demo.redhat.com/catalog?item=published.sovereign-cloud-lab.prod"
      relevance_score: 84
      why_it_fits: "This lab directly covers the majority of requested technologies — OpenShift, OpenShift Virtualization, ACM multi-cluster management, ACS security, GitOps with Argo CD, Quay, and Pipelines — with hands-on exercises in day-2 operations, secure-by-default policy enforcement, observability, and multi-cluster management across diverse cluster types."
    rejections: []

  infra:
    peak_environments: null
    cost_per_run_est: ""
    provisioning_time_est: "~20 min (cnv-pool topology)"
    agnosticv_base_ci: "agd_v2/security-roadshow-cnv"
    approved_by: ""
    rejections: []
