project:
  slug: "container-mgmt-cnv"
  owner_email: "jboeselm@redhat.com"
  content_type: "demo"
  deployment_mode: "rhdp_published"
  initiative_key: "none"
  showroom_type: "classic"
  intake_type: "new"
  automation_type: "gitops"
  description: "A hands-on OpenShift demo showcasing core container management capabilities — deploying third-party and existing applications, secure-by-default policies, day-2 cluster operations, observability, and multi-cluster management with Red Hat Advanced Cluster Management and Advanced Cluster Security"
  # content_reviewer_email and infra_reviewer_email are assigned by the RHDP team — not set by the author
  jira_ticket: "RHDPCD-973"
  workflow_id: "19b2a802-833c-4330-ab6c-c0c20bea817b"

spec:
  title: "Container Management Standard Demo"
  learning_objectives:
  - "Deploy third-party and existing applications on OpenShift without relying on application-platform-specific features"
  - "Demonstrate OpenShift's secure-by-default posture using Security Context Constraints, RBAC, and NetworkPolicies"
  - "Implement day-2 cluster operations, including an over-the-air upgrade, and observe self-healing/reconciliation behavior"
  - "Monitor cluster health and application performance using built-in observability tooling"
  - "Manage multiple clusters, including a non-OpenShift cluster, from a single hub using Red Hat Advanced Cluster Management"
  - "Secure the cluster and its workloads using Red Hat Advanced Cluster Security"
  modules:                 # [{id, title, duration_min}] — written by intake Phase 4; id is stable (e.g. module-01)
  - id: module-01
    title: "Console Overview"
    duration_min: 10
    status: not_started
  - id: module-02
    title: "Deploying Third-Party & Existing Applications"
    duration_min: 12
    status: not_started
  - id: module-03
    title: "Security by Default"
    duration_min: 10
    status: not_started
  - id: module-04
    title: "Day-2 Cluster Operations"
    duration_min: 10
    status: not_started
  - id: module-05
    title: "Observability"
    duration_min: 10
    status: not_started
  - id: module-06
    title: "Multi-Cluster Management with ACM"
    duration_min: 12
    status: not_started
  - id: module-07
    title: "Securing the Cluster with ACS"
    duration_min: 10
    status: not_started
  environment:
    platform: ""               # ocp | rhel-vms — determines which sizing fields apply
    topology: ""               # shared-cluster | per-student | cnv-pool
    cloud_provider: cnv        # cnv | aws | troshka — cnv is default
    max_concurrent_users: null # required if topology = shared-cluster

    # --- OCP-specific fields (only when platform = ocp) ---
    ocp_version: ""                    # e.g. 4.20 — minimum 4.20; leave empty for rhel-vms
    cluster_type: ""                   # sno | multinode — only for platform = ocp
    control_plane_instance_count: null # 1 if sno, 3 if multinode
    control_plane_cpu: null            # 32 if sno, 16 if multinode
    control_plane_ram_gb: null         # 128 if sno, 64 if multinode
    worker_count: null                 # number of OCP worker nodes
    worker_cpu: null                   # vCPU per worker
    worker_ram_gb: null                # RAM per worker in GB
    worker_disk_gb: null               # disk per worker in GB

    # --- VM-specific fields (only when platform = rhel-vms) ---
    # Each entry: {role, count, cpu, ram_gb, disk_gb, os}
    vms_per_student: []

    # --- Common fields (both platforms) ---
    aap_version: ""                    # required if AAP in products
    ai_requirement: ""                 # maas | gpu | none
    ai_model_tier: ""                  # open-source | frontier (if ai_requirement = maas or gpu)
    ai_model_name: ""                  # specific model e.g. granite-3.1-8b
    ai_justification: ""               # required if ai_model_tier = frontier or ai_requirement = gpu
    non_ga_products: []                # list of non-GA products/versions
    non_ga_access_plan: ""             # how access is provided for non-GA products
    external_services: []              # named external service dependencies e.g. [github.com]
    gpu_nodes: 0                       # number of GPU nodes (0 = none)
    gpu_type: ""                       # e.g. NVIDIA A100 40GB (required if gpu_nodes > 0)
  duration_hours: 1.4
  audience: "intermediate"   # beginner | intermediate | advanced

development:
  automation:
    status: not_started
  e2e:
    status: not_started
  healthCheck:
    status: not_started

compliance:
  last_hard_check: null
  hard_result: null

tracking:
  paused: false
  pause_reason: null

